<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>YTT 편집기</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><strong>YTT 편집기</strong><span class="badge">개발 중</span><label class="button">영상 열기<input id="videoFile" type="file" accept="video/mp4"></label><label class="button">자막 가져오기<input id="subtitleFile" type="file" accept=".ytt,.srv3,.srt,.ass"></label><label class="button">프로젝트 열기<input id="projectFile" type="file" accept=".json,.yttproj"></label><button id="saveProject">프로젝트 저장</button><label>출력 품질 <select id="quality"><option value="optimized">자동 최적화</option><option value="high">고품질</option></select></label><button id="estimate">출력 예상</button><button id="export">YTT 내보내기</button><span id="notice" role="status"></span></header>
<main><section class="preview"><div class="preview-head">미리보기 <span>개발 중 · YouTube 표시와 차이가 있을 수 있음</span></div><div id="stage"><video id="video" controls></video><div id="captions"></div></div><div class="controls"><button id="previous">이전 프레임</button><button id="next">다음 프레임</button><label>프레임 속도 <input id="fps" type="number" value="30" min="1" max="120"> fps</label><span id="clock">00:00.000</span></div><canvas id="waveform" height="70"></canvas></section>
<aside><h2>자막 속성</h2><p id="empty">타임라인에서 자막을 선택하세요.</p><div id="properties" hidden><label>텍스트<textarea id="cueText" rows="5"></textarea></label><label>시작 (초)<input id="cueStart" type="number" min="0" step="0.001"></label><label>종료 (초)<input id="cueEnd" type="number" min="0" step="0.001"></label><button id="apply">변경 적용</button><p id="preserveInfo"></p><fieldset id="effectPanel"><legend>키프레임</legend><label>적용 범위<select id="effectScope"><option value="all">자막 전체</option><option value="word">단어별</option><option value="character">글자별</option><option value="custom">글자 묶음</option></select></label><label>묶음 경계 (글자 번호, 쉼표로 구분)<input id="groupBoundaries" type="text" placeholder="예: 2,4"></label><label>시차 (밀리초)<input id="stagger" type="number" min="0" step="1" value="0"></label><label>순서<select id="staggerDirection"><option value="forward">앞에서 뒤로</option><option value="reverse">뒤에서 앞으로</option></select></label><label>속성<select id="effectProperty"><option value="opacity">글자 불투명도 (0~254)</option><option value="color">글자색 (#RRGGBB)</option><option value="position">위치 (X,Y %)</option><option value="size">글자 크기 (YTT 값)</option><option value="backgroundColor">배경색 (#RRGGBB)</option><option value="backgroundOpacity">배경 불투명도 (0~254)</option><option value="edgeColor">윤곽선 색 (#RRGGBB)</option></select></label><label>시작 값<input id="effectStart" type="text" value="0"></label><label>끝 값<input id="effectEnd" type="text" value="254"></label><label>속도<select id="effectEase"><option value="linear">선형</option><option value="ease-in">천천히 시작</option><option value="ease-out">천천히 끝</option><option value="ease-in-out">천천히 시작과 끝</option></select></label><button id="applyEffect">효과 적용</button><button id="removeEffect">이 속성 제거</button><p id="effectList"></p></fieldset></div></aside></main>
<section class="timeline"><div class="timeline-head"><strong>타임라인</strong><button id="addTrack">트랙 추가</button><button id="addCue">현재 위치에 자막 추가</button><label>확대 <input id="zoom" type="range" min="20" max="200" value="60"></label><span id="timelineInfo"></span></div><div id="trackList"></div></section>
<script type="module" src="/app.js"></script></body></html>
